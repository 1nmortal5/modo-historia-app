<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Historia Yael</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>

<body class="bg-[#121110] text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Polyfill local storage
    if (!window.storage) {
      window.storage = {
        get: async (k) => { const v = localStorage.getItem(k); return v ? { value: v } : null; },
        set: async (k, v) => { localStorage.setItem(k, v); }
      };
    }

    // Código principal de Modo Historia
    function ModoHistoriaApp() {
      const [xp, setXp] = useState(120);
      const [coins, setCoins] = useState(45);
      const [habits, setHabits] = useState([
        { id: 1, name: "Lectura / Desarrollo Personal", area: "Mente", xp: 20, done: false },
        { id: 2, name: "Entrenamiento / Ejercicio", area: "Salud", xp: 25, done: false },
        { id: 3, name: "Estudio de Mercado / Trading", area: "Dinero", xp: 30, done: false }
      ]);

      const toggleHabit = (id) => {
        setHabits(habits.map(h => {
          if (h.id === id) {
            if (!h.done) {
              setXp(prev => prev + h.xp);
              setCoins(prev => prev + 10);
            } else {
              setXp(prev => Math.max(0, prev - h.xp));
              setCoins(prev => Math.max(0, prev - 10));
            }
            return { ...h, done: !h.done };
          }
          return h;
        }));
      };

      return (
        <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col gap-6">
          {/* Header Status */}
          <div class="bg-[#1c1a17] border border-[#2d2924] p-4 rounded-xl flex justify-between items-center shadow-lg">
            <div>
              <h1 class="text-xl font-bold text-amber-500">Modo Historia</h1>
              <p class="text-xs text-gray-400">Nivel 2 • Disciplina Activa</p>
            </div>
            <div class="text-right">
              <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-md font-mono">
                {xp} XP
              </span>
              <div class="text-xs text-yellow-500 font-mono mt-1">🪙 {coins} Monedas</div>
            </div>
          </div>

          {/* Lista de Hábitos */}
          <div class="space-y-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Misiones Diarias</h2>
            {habits.map(h => (
              <div 
                key={h.id} 
                onClick={() => toggleHabit(h.id)}
                class={`p-4 rounded-xl border transition-all cursor-pointer flex justify-between items-center ${
                  h.done 
                    ? 'bg-amber-500/10 border-amber-500/40 text-amber-200' 
                    : 'bg-[#1c1a17] border-[#2d2924] hover:border-gray-600'
                }`}
              >
                <div>
                  <div class="font-medium text-sm">{h.name}</div>
                  <div class="text-xs text-gray-500">{h.area} • +{h.xp} XP</div>
                </div>
                <div class={`w-6 h-6 rounded-full border flex items-center justify-center ${
                  h.done ? 'bg-amber-500 border-amber-500 text-black font-bold' : 'border-gray-600'
                }`}>
                  {h.done ? '✓' : ''}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ModoHistoriaApp />);
  </script>
</body>
</html>
