<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Historia Yael</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>
<body class="bg-[#121110] text-white">
  <div id="root"></div>

  <script>
    // Polyfill de storage
    if (!window.storage) {
      window.storage = {
        get: async (k) => { const v = localStorage.getItem(k); return v ? { value: v } : null; },
        set: async (k, v) => { localStorage.setItem(k, v); }
      };
    }
  </script>

  <script type="text/babel" data-presets="react">
    // Exponer librerías a nivel global antes de cargar App.jsx
    window.React = React;
    window.useState = React.useState;
    window.useEffect = React.useEffect;
    window.useRef = React.useRef;

    // Íconos de Lucide
    if (window.lucide) {
      window.Check = lucide.Check;
      window.X = lucide.X;
      window.Plus = lucide.Plus;
      window.Trash2 = lucide.Trash2;
      window.Coins = lucide.Coins;
      window.AlertTriangle = lucide.AlertTriangle;
      window.Award = lucide.Award;
      window.Zap = lucide.Zap;
      window.Target = lucide.Target;
      window.Shield = lucide.Shield;
      window.BookOpen = lucide.BookOpen;
      window.Flame = lucide.Flame;
    }

    // Componentes de Recharts
    if (window.Recharts) {
      window.RadarChart = Recharts.RadarChart;
      window.PolarGrid = Recharts.PolarGrid;
      window.PolarAngleAxis = Recharts.PolarAngleAxis;
      window.PolarRadiusAxis = Recharts.PolarRadiusAxis;
      window.Radar = Recharts.Radar;
      window.ResponsiveContainer = Recharts.ResponsiveContainer;
    }
  </script>

  <!-- Cargar tu archivo App.jsx original -->
  <script type="text/babel" data-presets="react" src="./App.jsx"></script>
</body>
</html>
